# Loaded after TPM. Handwritten status bar — see ~/dotfiles/STATUSLINES.md.
# Catppuccin-mocha colors via hex; flat segments separated by " · "; no
# powerline caps or background fills.
set -g status-style bg=default   # transparent status bar

set -g status 2                  # two-row status bar
set -g status-position bottom
set -g status-interval 15
set -g status-left-length 40
set -g status-right-length 60
set -g status-justify left

# Row 0 (upper of the two rows): window list only.
set -g status-format[0] "#[align=left,fg=#f9e2af,bold]   #[fg=default,nobold]#[list=on]#{W:#[range=window|#{window_index}]#[push-default]#{T:window-status-format}#[pop-default]#[norange]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on]#{?window_end_flag,,#{window-status-separator}}}"

# Row 1 (below row 0, the bottommost): status-left + status-right.
set -g status-format[1] "#[align=left]#{T;=/#{status-left-length}:status-left}#[align=right]#{T;=/#{status-right-length}:status-right}"

# Window list — name:number, dim by default, mauve+bold for current.
set -g window-status-separator " "
set -g window-status-format         "#[fg=#a6adc8]#W:#I"
set -g window-status-current-format "#[fg=#cba6f7,bold]#W:#I#[nobold]#{?window_zoomed_flag, ,}"

# Left: session name only.
set -g status-left  " #[fg=#cba6f7,bold]  #{s/-[0-9]+$//:session_name} #[default]"

# Right: host · clock. Trailing spaces mirror the leading whitespace on the
# left edge so both ends of the status bar feel balanced. Time uses the
# French convention (13h29) rather than 13:29.
set -g status-right "#[fg=#89b4fa]󰒋 #h #[fg=#a6adc8]· #[fg=#cdd6f4]%Hh%M   "
# set -g status-right "#[fg=#89b4fa]󰒋 #h #[fg=#a6adc8]· #[fg=#fab387]#{b:pane_current_path} #[fg=#a6adc8]· #[fg=#cdd6f4]%Hh%M   "
