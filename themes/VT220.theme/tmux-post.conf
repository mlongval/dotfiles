# Loaded after TPM.  One-row ASCII status bar for terminals with no UTF-8
# and no Nerd Font (the K4510).  The bar in the screen's own colours; only
# the current window is in reverse video (bold, with tmux's `*`), which a
# monochrome VT220 shows too.
#
# Every `set -g` here is a session option, so tmux/k4510-clients.sh can lay
# the same lines over one session (a K4510 client's) as `set -t <session>`.
# Window options take `set -gw` and are left out of that.

set -g status on
set -g status-interval 15
set -g status-style default
set -g message-style reverse
set -g message-command-style reverse

# The whole row: [session] (its -N suffix dropped, as in Summer_2026), the
# windows as number:name and tmux's flags (* current, - last, Z zoomed,
# # activity), and on the right host | clock, French style (13h29).
set -g status-format[0] "#[align=left] [#{=16:#{s/-[0-9]+$//:session_name}}] #{W: #I:#W#F ,#[reverse bold] #I:#W#F #[noreverse nobold]}#[align=right] #h | %Hh%M "

# Pane borders in plain - and | instead of box drawing.
set -gw pane-border-lines simple
