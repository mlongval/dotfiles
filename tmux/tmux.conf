# =============================================================================
# Terminal
# =============================================================================
set -g default-terminal 'tmux-direct'
set -g terminal-overrides ',xterm-256color:RGB,tmux-256color:RGB'
set-environment -g COLORTERM truecolor
set-environment -g FORCE_COLOR 3
set -g default-shell /home/linuxbrew/.linuxbrew/bin/zsh
# set -g default-shell /usr/bin/zsh

# =============================================================================
# General Options
# =============================================================================
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g allow-passthrough on      # allow OSC 52 to pass through to terminal
set -g status-position bottom
set -g mouse on
set -g mode-keys vi

# =============================================================================
# Prefix
# =============================================================================
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# prefix S → prompt for name, create+switch to a new session
bind S command-prompt -p "New session name:" "new-session -s '%%'"

# =============================================================================
# Key Bindings
# =============================================================================
bind - split-window -v -c "#{pane_current_path}"   # vertical split
bind _ split-window -v -c "#{pane_current_path}" "WORKS_AUTOCLOSE=1 works"  # vertical split + run works (auto-closes pane on exit)
bind | split-window -h -c "#{pane_current_path}"   # horizontal split
bind v split-window -h -c "#{pane_current_path}"   # horizontal split (alt)
bind R command-prompt "select-pane -T '%%'"         # rename pane
bind r source-file ~/.tmux.conf \; display "Config reloaded!"  # reload config
bind m resize-pane -Z                               # zoom pane

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# =============================================================================
# Plugins
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
# catppuccin-tmux retired 2026-05-11 — replaced by handwritten status block
# below (see STATUSLINES.md). Re-enable + uncomment the @catppuccin_* block
# below to roll back.
# set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'

# -- fzf-url --
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# -- sessionx --
set -g @sessionx-bind 'o'
#set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

# -- resurrect / continuum --
set -g @continuum-restore 'off'
set -g @resurrect-strategy-nvim 'session'

